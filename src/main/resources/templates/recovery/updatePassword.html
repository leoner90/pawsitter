<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawSitter | Update Password</title>
    <link rel="stylesheet" th:href="@{/css/mainStyle.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-content">
    <section class="form-container">
        <h1>Set a new password</h1>

        <form th:action="@{/recovery/updatePassword}" method="post">

            <p th:if="${error}" class="form-error" th:text="${error}"></p>

            <input type="hidden" name="recoveryToken" th:value="${recoveryToken}"/>

            <label for="newPassword">New password</label>
            <input id="newPassword" name="newPassword" type="password" required>

            <label for="confirmNewPassword">Confirm password</label>
            <input id="confirmNewPassword" name="confirmNewPassword" type="password" required>

            <button type="submit" class="button primary-button">Confirm</button>
        </form>

        <p>
            Back to login?
            <a th:href="@{/login}">Log in</a>
        </p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
