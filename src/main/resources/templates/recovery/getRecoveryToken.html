<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawSitter | Password Recovery</title>
    <link rel="stylesheet" th:href="@{/css/mainStyle.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-content">
    <section class="form-container">
        <h1>Forgot your password?</h1>

        <form th:action="@{/recovery}" method="post">

            <p th:if="${error}" class="form-error" th:text="${error}"></p>

            <label for="email">Enter your email</label>
            <input id="email" name="email" type="email" required>

            <button type="submit" class="button primary-button">Send recovery email</button>
        </form>

        <p>
            Remember your password?
            <a th:href="@{/login}">Log in</a>
        </p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
