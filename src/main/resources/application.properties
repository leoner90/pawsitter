spring.application.name=pawsitter

# --- Server ---
server.port=${SERVER_PORT:3400}
#We need to figure out this
#app.frontend.base-url=https://pawsitter.lv

spring.config.import=optional:file:.env[.properties]

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawsitter}
spring.datasource.username=${DB_USERNAME:pawsitter}
spring.datasource.password=${DB_PASSWORD}

# -- Mail and Jwt

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Multipart ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT / Security ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# --- MailerSend API ---
mailersend.base-url=https://api.mailersend.com/v1
mailersend.token=${MAILERSEND_TOKEN}

# --- Stripe secret---
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# APP base url
app.base-url=${APP_BASE_URL:http://localhost:3400}

# For emails
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3400}
