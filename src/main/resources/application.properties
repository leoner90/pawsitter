spring.application.name=pawsitter

# --- Server ---
server.port=${SERVER_PORT:3400}

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawsitter}
spring.datasource.username=${DB_USERNAME:pawsitter}
spring.datasource.password=${DB_PASSWORD:pawsitter_password}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Multipart ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT / Security ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# --- MailerSend API ---
mailersend.base-url=https://api.mailersend.com/v1
mailersend.token=${MAILERSEND_TOKEN}