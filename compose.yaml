services:
  mysql:
    image: mysql:8.4
    container_name: pawsitter-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: pawsitter
      MYSQL_USER: pawsitter
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - pawsitter-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 240s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pawsitter-app
    restart: unless-stopped

    environment:
      SERVER_PORT: 3400
      DB_URL: jdbc:mysql://mysql:3306/pawsitter
      DB_USERNAME: pawsitter
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAILERSEND_TOKEN: ${MAILERSEND_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}

    ports:
      - "3400:3400"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pawsitter-mysql-data: